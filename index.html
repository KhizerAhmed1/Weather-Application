<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>  
  <h1>Weather App</h1>

  <form id="searchForm">
    <input id="cityInput" type="text" placeholder="Enter city (e.g. Lahore)" aria-label="City name" required>
    <button type="submit">Search</button>
  </form>
  <button class="alt" id="locBtn" type="button">Use my current location</button>

  <div id="status" role="status" aria-live="polite"></div>
  <div class="spinner" id="spinner" hidden aria-label="Loading"></div>

  <section class="card" id="result" hidden>
    <div class="place" id="place"></div>
    <div class="top"><div class="temp" id="temp"></div><div class="icon" id="icon" aria-hidden="true"></div></div>
    <div class="cond" id="cond"></div>
    <div class="grid">
      <div><small>Feels like</small><span id="feels"></span></div>
      <div><small>Humidity</small><span id="humidity"></span></div>
      <div><small>Wind</small><span id="wind"></span></div>
      <div><small>Precipitation</small><span id="precip"></span></div>
    </div>
    <div class="forecast" id="forecast"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
